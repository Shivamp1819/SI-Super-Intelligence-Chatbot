<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2233" />
      <stop offset="70%" stop-color="#050e17" />
      <stop offset="100%" stop-color="#02060a" />
    </radialGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00fffc" />
      <stop offset="50%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#00fffc" />
    </linearGradient>

    <!-- Neon Cyan & Electric Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00fffc" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Star Burst Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00fffc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0088ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0033aa" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Dark Shield Circular Plate -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Inner Metallic Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#00fffc" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Quantum Star Burst Flare behind Monogram -->
  <g filter="url(#neonGlow)" transform="translate(256, 256)">
    <!-- 8-pointed Radiant Quantum Star -->
    <polygon points="0,-180 32,-45 180,0 45,32 0,180 -32,45 -180,0 -45,-32" fill="url(#starGrad)" />
    <!-- Secondary Intersecting Diamond Core -->
    <polygon points="0,-120 22,-30 120,0 30,22 0,120 -22,30 -120,0 -30,-22" fill="#00fffc" fill-opacity="0.2" />
    <!-- Quantum Spark Rays -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#coreGlow)" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#00fffc" stroke-width="3" stroke-opacity="0.8" />
  </g>

  <!-- Main "SI" Futuristic Cyber Monogram -->
  <g filter="url(#coreGlow)">
    <!-- Letter "S" Component -->
    <path d="M 230 160 C 230 135 205 115 165 115 C 120 115 95 145 95 185 C 95 240 160 250 205 270 C 240 286 250 315 250 345 C 250 395 210 425 155 425 C 110 425 75 395 75 355 L 115 355 C 115 375 130 390 155 390 C 185 390 208 372 208 345 C 208 305 145 295 105 275 C 75 258 55 228 55 185 C 55 130 100 80 165 80 C 230 80 270 120 270 160 Z"
          fill="none"
          stroke="url(#cyanBlueGrad)"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- "S" Inner Neon Core Line -->
    <path d="M 230 160 C 230 135 205 115 165 115 C 120 115 95 145 95 185 C 95 240 160 250 205 270 C 240 286 250 315 250 345 C 250 395 210 425 155 425 C 110 425 75 395 75 355"
          fill="none"
          stroke="#ffffff"
          stroke-width="5"
          stroke-linecap="round"
          opacity="0.85" />

    <!-- Letter "I" Component (Futuristic Pillar with Apex Crown) -->
    <polygon points="360,75 385,110 360,145 335,110" fill="#ffffff" stroke="#00fffc" stroke-width="4" filter="url(#coreGlow)" />

    <path d="M 335 170 L 385 170 L 375 390 L 400 390 L 400 425 L 320 425 L 320 390 L 345 390 Z"
          fill="none"
          stroke="url(#cyanBlueGrad)"
          stroke-width="18"
          stroke-linejoin="round" />

    <line x1="360" y1="185" x2="360" y2="385" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />

    <circle cx="285" cy="205" r="5" fill="#00fffc" />
    <circle cx="300" cy="285" r="4" fill="#00fffc" opacity="0.8" />
    <circle cx="280" cy="360" r="5" fill="#00fffc" />
    <line x1="285" y1="210" x2="300" y2="280" stroke="#00fffc" stroke-width="2" opacity="0.5" stroke-dasharray="3 3" />
    <line x1="300" y1="290" x2="280" y2="355" stroke="#00fffc" stroke-width="2" opacity="0.5" stroke-dasharray="3 3" />
  </g>
</svg>
